framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    handle_all_throwables: true
    php_errors:
        log: true
    router:
        utf8: true
    session:
        storage_factory_id: session.storage.factory.native
        cookie_secure: auto
        cookie_samesite: lax
    http_client:
        default_options:
            timeout: 180
            max_duration: 300
